<!-- External template used by CourseList. -->
<section class="page"><h2>Available Courses</h2><p *ngIf="loading$ | async">Loading courses...</p><p *ngIf="error$ | async as error">{{error}}</p><ng-container *ngIf="courses$ | async as courses; else noCourses"><ng-container *ngIf="enrolledIds$ | async as ids"><div class="course-grid"><app-course-card *ngFor="let course of courses; trackBy:trackByCourseId" appHighlight="lightblue" [course]="course" [enrolled]="ids.includes(course.id)" (enrollRequested)="onEnroll($event, ids.includes(course.id))" (selected)="open($event)"></app-course-card></div></ng-container></ng-container><p *ngIf="selectedCourseId">Selected course ID: {{selectedCourseId}}</p><ng-template #noCourses><p>No courses available.</p></ng-template></section>
