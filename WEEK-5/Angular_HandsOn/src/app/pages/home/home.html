<section class="page page-home"><h1>{{portalName}}</h1><p>Browse courses, enroll in classes, and check your profile details.</p><button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button><p>{{message}}</p><!-- [property] is component-to-DOM; [(ngModel)] keeps DOM and component in sync. --><input [(ngModel)]="searchTerm" placeholder="Search courses"><p>Searching for: {{searchTerm}}</p><div class="stats-row"><div>Courses Available: 12</div><div>Enrolled: 3</div><div>GPA: 3.8</div></div></section>
