<section class="page"><h2>Reactive Enrollment Form</h2><form [formGroup]="enrollForm" (ngSubmit)="submit()"><label>Name <input formControlName="studentName"></label><small *ngIf="f.studentName.touched && f.studentName.invalid">Name is required (minimum 3 characters).</small><label>Email <input formControlName="studentEmail"></label><small *ngIf="f.studentEmail.touched && f.studentEmail.invalid">Valid email is required.</small><label>Course ID <input type="number" formControlName="courseId"></label><label>Semester <select formControlName="preferredSemester"><option value="">Select</option><option>Odd</option><option>Even</option></select></label><label><input type="checkbox" formControlName="agreeToTerms"> Agree to terms</label><button type="submit">Submit</button></form><p *ngIf="submitted">Reactive enrollment submitted successfully.</p></section>
