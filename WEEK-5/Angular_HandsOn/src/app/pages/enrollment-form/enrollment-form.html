<section class="page">
  <h2>Enrollment Request</h2>
  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)" novalidate>
    <label>Name <input name="studentName" [(ngModel)]="studentName" required minlength="3" #studentName="ngModel" /></label>
    <small *ngIf="studentName.invalid && studentName.touched">Name must contain at least 3 characters.</small>
    <label>Email <input type="email" name="studentEmail" [(ngModel)]="studentEmail" required email #studentEmail="ngModel" /></label>
    <small *ngIf="studentEmail.invalid && studentEmail.touched">Enter a valid email address.</small>
    <label>Course ID <input type="number" name="courseId" [(ngModel)]="courseId" required min="1" #courseIdControl="ngModel" /></label>
    <small *ngIf="courseIdControl.invalid && courseIdControl.touched">Choose a valid course ID.</small>
    <label>Preferred semester <select name="preferredSemester" [(ngModel)]="preferredSemester" required><option value="">Select</option><option>Odd</option><option>Even</option></select></label>
    <label><input type="checkbox" name="agreeToTerms" [(ngModel)]="agreeToTerms" required /> I agree to the terms</label>
    <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
  </form>
  <p *ngIf="submitted">{{ successMessage }}</p>
</section>
