<article class="course-card" [ngClass]="cardClasses" [ngStyle]="{'border-left-color':borderColor}" (click)="selected.emit(course.id)"><h3>{{course.name}}</h3><p>Code: {{course.code | uppercase}}</p><p>Credits: {{course.credits | creditLabel}}</p><span [ngSwitch]="course.gradeStatus"><b *ngSwitchCase="'passed'">Passed</b><b *ngSwitchCase="'failed'">Failed</b><b *ngSwitchDefault>Pending</b></span><p *ngIf="isExpanded">Course ID: {{course.id}}. Click Enroll to request a seat.</p><button (click)="$event.stopPropagation(); enrollRequested.emit(course.id)">{{enrolled?'Unenroll':'Enroll'}}</button><button (click)="$event.stopPropagation(); isExpanded=!isExpanded">Show Details</button></article>
